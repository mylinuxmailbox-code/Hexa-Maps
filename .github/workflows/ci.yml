name: Hexa Maps CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Unit/Integration Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run strict TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit, schema, spatial DB, API & UI suites
        run: npm test

      - name: Production build (@hexa/shared, @hexa/shields, @hexa/api, @hexa/web)
        run: npm run build

  e2e:
    name: Playwright E2E Verification
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies & Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build Next.js frontend
        run: npm run build -w @hexa/web

      - name: Run Playwright E2E tests against live API + Web server
        run: |
          nohup npm run start -w @hexa/api > /tmp/hexa-api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/api/v1/health && break || sleep 1; done
          npx playwright test --project="Desktop Chromium" --project="Mobile Pixel 7"
        working-directory: apps/web
